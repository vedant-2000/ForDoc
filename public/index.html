<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Treatment Plan — chart-based treatment planning for clinics.">

  <!-- Viewport: prevent zoom shifts around the marker canvas; allow the
       browser to draw under system UI on modern devices. `viewport-fit=cover`
       is what makes the CSS env(safe-area-inset-*) values non-zero on iOS
       so notched devices don't cut off the top bar. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, minimum-scale=1, maximum-scale=1, user-scalable=no">

  <!-- Address-bar tint matches the app's paper-cream background so the
       transition from browser chrome to app content is seamless. -->
  <meta name="theme-color" content="#2A2A2A"
        media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2A2A2A"
        media="(prefers-color-scheme: dark)">

  <!-- iOS "Add to Home Screen" support. Modern iOS Safari uses these two
       specific meta tags to launch the site as a full-screen PWA (no
       Safari chrome) once the user picks "Add to Home Screen" from the
       share sheet. `apple-touch-icon` is the icon iOS shows on the home
       screen; without it iOS uses a screenshot of the page. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Treatment Plan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Treatment Plan</title>
  <link rel="manifest" href="manifest.json">

  <!-- Install-prompt capture. MUST stay above every other script.

       Chrome fires `beforeinstallprompt` a second or two after load, which is
       long before the Flutter bundle has downloaded and booted - and the app
       only mounts its banner after the /api/auth/me round-trip finishes on
       top of that. The event is one-shot and is never replayed, so a listener
       added that late simply never sees it and the in-app Install button can
       never appear. Park the event here; PwaInstall.init() collects it. -->
  <script>
    window.__deferredInstallPrompt = null;
    window.__appInstalled = false;
    window.addEventListener('beforeinstallprompt', function (e) {
      // Suppress Chrome's own mini-infobar; the app shows its own banner.
      e.preventDefault();
      window.__deferredInstallPrompt = e;
    });
    window.addEventListener('appinstalled', function () {
      window.__appInstalled = true;
      window.__deferredInstallPrompt = null;
    });
  </script>

  <!-- Runtime config: backend renders this from APP_API_BASE (see server.js).
       Sets window.APP_CONFIG.apiBase BEFORE Dart code loads so config.dart
       can read it. Cache-busted server-side so a live-server env change
       takes effect on the very next page reload — no Flutter rebuild. -->
  <script src="config.js"></script>
</head>
